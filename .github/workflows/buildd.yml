
name: Build Alpha Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -o alpha-bot.zip -d .

      - name: Build Android64
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Bot-Android64
          path: ${{ steps.build.outputs.build-output }}
          
